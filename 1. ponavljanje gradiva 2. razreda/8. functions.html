<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // sintaksa za pisanje funkcije
        // ključna riječ function, naziv funkcije: počinje sa glagolom, dodajemo ()
        // zatim tijelo funkcije {...}
        function checkCarPower() {
            const carPower = 200
            // sintaksa za pisanje if uvjeta:
            // if (uvjet)
            if (carPower > 150) {
                console.log('Auto je brz')
            }
        }

        function checkTemperature() {
            const temperature = 34
            const isSummer = true
            // If uvjet se uvijek svodi na rezultat true ili false
            // Kako program svodi uvjet na true ili false, uvrštava vrijednosti varijabli
            // 1. 34 > 23 && true === true
            // 2. true && true === true
            // 3. true === true
            // 4. true
            if (temperature > 32 && isSummer === true) {
                console.log('Mozemo na more')
            }
            // skracena verzija === true nije potrebno
            if (temperature > 32 && isSummer) {
                console.log('Mozemo na more')
            }

            if (isSummer) {
                console.log('Ljeto')
            } else {
                console.log('Nije ljeto')
            }
        }

        function checkCarType() {
            const carWeight = 3000
            if (carWeight < 1100) {
                console.log('Sportsko auto')
            } else if (carWeight > 1100 && carWeight < 1500) {
                console.log('Limuzina')
            } else if (carWeight > 1500 && carWeight < 2000) {
                console.log('SUV')
            } else {
                console.log('Kamion')
            }
        }

        function checkGrades() {
            // napraviti program u kojem ćete unijeti 5 ocjena
            // te ispitati svaku ocjenu da li je ocjena veća od 3
            // ako jeste: u konzolu ispisati učenik je prošao,
            // ako nije ispisati učenik nije prošao
            const grades = [3, 3, 2, 1, 5, 3, 2, 2, 3, 4, 3, 2, 3, 4, 4, 3, 3, 2, 3, 4, 4, 3, 3, 3, 4, 4, 3]
            for (let index = 0; index < grades.length; index++) {
                const element = grades[index];
                if (element > 3) {
                    console.log('Ocjena je veca od 3')
                } else {
                    console.log('Ucenik nije prosao')
                }
            }
        }

        function checkGradesFromStudentsArray() {
            // Napraviti program u kojem ćete unijeti 5 učenika
            // Svaki učenik ima: ime, prezime i opci uspjeh
            // Za svakog učenika ispisati njegovo ime i prezime
            // i ako ima opci uspjeh veći od 3, napisati da je dobio stipendiju
            // a ako je ocjena manja ili jednaka 3, napisati da nije dobio stipendiju
            // Primjer ispisa u konzoli: Ime je Ante, prezime je Antić i učenik je dobio stipendiju

            const students = [
                { name: 'Mario', surname: 'Šutalo', grade: 3.4 },
                { name: 'Mario', surname: 'Šutalo', grade: 2.5 },
                { name: 'Mario', surname: 'Šutalo', grade: 3 },
                { name: 'Mario', surname: 'Šutalo', grade: 4 },
                { name: 'Mario', surname: 'Šutalo', grade: 2 },
            ]
            let StudentGradesSum = 0
            for (let index = 0; index < students.length; index++) {
                const student = students[index];
                if (student.grade > 3) {
                    console.log(`Ime je ${student.name}, prezime je ${student.surname} i učenik je dobio stipendiju`)
                } else {
                    console.log(`Ime je ${student.name}, prezime je ${student.surname} i učenik nije dobio stipendiju`)
                }
                StudentGradesSum = StudentGradesSum + student.grade
            }
            const studentAverageGrade = StudentGradesSum / students.length
            console.log(`Prosjecna ocjena studenta je ${studentAverageGrade}`)
        }
        // sintaksa za pozivanje funkcije
        // naziv funkcije pa zagrada
        // checkCarPower()
        // checkGradesFromStudentsArray()

        // izracunaj povrsinu pravokutnika sa slijedećim duljinama stranica:
        // a1 = 12, b1 = 10, a2 = 30, b2 = 21; a3 = 1; b3 = 12;
        // te ispiši povrsinu svakog pravokutnika u konzolu, npr: povrsina je 120
        const a1 = 12
        const b1 = 10
        const surface1 = a1 * b1
        console.log(`Povrsina je ${surface1}`)

        const a2 = 30
        const b2 = 21
        const surface2 = a2 * b2
        console.log(`Povrsina je ${surface2}`)

        const a3 = 1
        const b3 = 12
        const surface3 = a3 * b3
        console.log(`Povrsina je ${surface3}`)

        // pravilna verzija pomocu funkcije
        // funkcije se koriste i da izbjegnemo pisanje duplog koda
        function calculateSurfaceArea(a, b) {
            const surface = a * b
            console.log(`Povrsina je ${surface}`)
        }
        calculateSurfaceArea(12, 10)
        calculateSurfaceArea(30, 21)
        calculateSurfaceArea(1, 12)
    </script>
</body>

</html>
